[package]
name = "north"
description = "Bot oficial do Discord do ecossistema North."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
nortcod = { git = "https://github.com/North-DiscordBot/NortCod.git", rev = "16f98cb69a5b8e8db18cbe8383fe09d48b2ce4fd" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
