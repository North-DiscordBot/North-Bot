[package]
name = "north"
description = "Bot oficial do Discord do ecossistema North."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/North-DiscordBot/North-Bot"
publish = false

[dependencies]
nortcod = { git = "https://github.com/North-DiscordBot/NortCod.git", rev = "2c58286f36e7eda5e65fb12de3ecafb5e991aa1e" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
